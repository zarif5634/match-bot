name: 24/7 Match Intelligence Bot

on:
  workflow_dispatch:
  schedule:
    - cron: '0 */5 * * *'
  push:
    branches: [ main ]

permissions:
  contents: write

jobs:
  run-bot:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install discord.py aiohttp google-generativeai requests
      - name: Run Bot Privately
        env:
          DISCORD_BOT_TOKEN: ${{ secrets.DISCORD_BOT_TOKEN }}
        run: timeout 330m python3 main.py || true
      - name: Save Lifetime Stats Permanently
        if: always()
        run: |
          if [ -f ledger.json ]; then
            git config user.name "Stats-Bot"
            git config user.email "bot@github.com"
            git add ledger.json
            git commit -m "Auto-save Lifetime Stats [skip ci]" || true
            git push || true
          fi
