name: 24/7 Match Intelligence Bot

on:
  workflow_dispatch:
  schedule:
    - cron: "0 */5 * * *"
  push:
    branches: [ main ]
    paths:
      - "main.py"
      - ".github/workflows/bot_24_7.yml"

concurrency:
  group: match-bot-runner
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  run-bot:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install discord.py aiohttp
      - name: Run Bot 24/7
        env:
          DISCORD_BOT_TOKEN: ${{ secrets.DISCORD_BOT_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: timeout 330m python3 main.py || true
